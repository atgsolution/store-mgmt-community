name: Printer compatibility report
description: Report a working or failing 80 mm receipt-printer setup
title: "[Printer]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing hardware compatibility data. Remove receipts, credentials, customer details, and other private information before attaching files or photos.
  - type: input
    id: printer
    attributes:
      label: Printer manufacturer and model
      placeholder: Example: iPOS iTP86
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB
        - Network / LAN
        - Bluetooth
        - Other
    validations:
      required: true
  - type: dropdown
    id: print_path
    attributes:
      label: Print path
      options:
        - Browser print dialog
        - Direct WebUSB ESC/POS
        - Both
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client device, operating system, and browser
      placeholder: Example: Windows 11 laptop, Chrome 140
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works without changes
        - Works after configuration
        - Partially works
        - Does not work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Configuration and observed behavior
      description: Include paper size, driver or USB details, print density, margins, text size, and any required workaround.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional evidence
      description: Attach a privacy-safe receipt photo, screenshot, or relevant logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed customer data, credentials, and other private information from all attachments.
          required: true
