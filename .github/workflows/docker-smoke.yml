name: Docker smoke test

on:
  push:
    branches:
      - main
      - agent/database-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: store-mgmt-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate setup tooling
        shell: bash
        run: |
          bash -n scripts/setup-linux.sh
          password_hash="$(printf '%s' 'SetupCheck123!' | node scripts/hash-password.mjs)"
          [[ "$password_hash" =~ ^scrypt\$[0-9a-f]{32}\$[0-9a-f]{128}$ ]]

      - name: Typecheck and frontend build
        run: |
          npm run typecheck
          npm run build

      - name: Create isolated test environment
        shell: bash
        run: |
          staff_password="$(openssl rand -base64 24 | tr -d '\n')Aa1!"
          admin_password="$(openssl rand -base64 24 | tr -d '\n')Aa1!"
          echo "::add-mask::$staff_password"
          echo "::add-mask::$admin_password"
          printf '%s\n%s\n%s\n%s\n' \
            "$admin_password" "$admin_password" \
            "$staff_password" "$staff_password" \
            | bash scripts/setup-linux.sh
          {
            echo "STAFF_TEST_PASSWORD=$staff_password"
            echo "ADMIN_TEST_PASSWORD=$admin_password"
          } >> "$GITHUB_ENV"

      - name: Build and start Compose stack
        run: docker compose up -d --build

      - name: Show Compose status
        run: docker compose ps

      - name: Wait for web/API health
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:6086/healthz >/dev/null && curl --fail --silent http://127.0.0.1:6086/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color api migrate hot-db archive-db
          exit 1

      - name: Test API roles, orders, Paid and audit
        run: node scripts/docker-smoke.mjs

      - name: Seed a 61-day order in hot DB
        shell: bash
        run: |
          docker compose exec -T hot-db psql -v ON_ERROR_STOP=1 -U store_mgmt -d store_mgmt_hot <<'SQL'
          INSERT INTO orders(id, store_id, order_number, table_number, service_type, subtotal, discount, deposit, total, remaining, note, payment_method, status, created_by_username, updated_by_username, paid_by_username, paid_at, created_at, updated_at)
          VALUES ('11111111-1111-1111-1111-111111111111', '00000000-0000-0000-0000-000000000001', '#ARCHIVE-SMOKE', '02', 'Tai cho', 3000, 0, 0, 3000, 3000, 'archive smoke', 'TM', 'PAID', 'staff', 'staff', 'staff', now() - interval '61 days', now() - interval '61 days', now() - interval '61 days');
          INSERT INTO order_items(id, order_id, line_no, product_id, product_name, unit_price, quantity, line_total, note)
          VALUES ('11111111-1111-1111-1111-111111111112', '11111111-1111-1111-1111-111111111111', 1, NULL, 'Archive smoke', 3000, 1, 3000, '');
          INSERT INTO audit_logs(id, store_id, created_at, username, role, action, target, detail)
          VALUES ('11111111-1111-1111-1111-111111111113', '00000000-0000-0000-0000-000000000001', now() - interval '61 days', 'staff', 'staff', 'Tao don', '#ARCHIVE-SMOKE', 'archive smoke');
          SQL

      - name: Run archive once and verify hot/archive move
        run: |
          docker compose run --rm --no-deps --entrypoint node archive-worker server/archive.mjs
          test "$(docker compose exec -T archive-db psql -At -U store_mgmt -d store_mgmt_archive -c "SELECT count(*) FROM orders WHERE id = '11111111-1111-1111-1111-111111111111'")" = "1"
          test "$(docker compose exec -T hot-db psql -At -U store_mgmt -d store_mgmt_hot -c "SELECT count(*) FROM orders WHERE id = '11111111-1111-1111-1111-111111111111'")" = "0"

      - name: Seed a one-year-old archive order
        shell: bash
        run: |
          docker compose exec -T archive-db psql -v ON_ERROR_STOP=1 -U store_mgmt -d store_mgmt_archive <<'SQL'
          INSERT INTO orders(id, store_id, order_number, table_number, service_type, subtotal, discount, deposit, total, remaining, note, payment_method, status, created_by_username, updated_by_username, paid_by_username, paid_at, created_at, updated_at)
          VALUES ('22222222-2222-2222-2222-222222222221', '00000000-0000-0000-0000-000000000001', '#COLD-SMOKE', '03', 'Tai cho', 4000, 0, 0, 4000, 4000, 'cold smoke', 'CK', 'PAID', 'staff', 'staff', 'staff', now() - interval '366 days', now() - interval '366 days', now() - interval '366 days');
          INSERT INTO order_items(id, order_id, line_no, product_id, product_name, unit_price, quantity, line_total, note)
          VALUES ('22222222-2222-2222-2222-222222222222', '22222222-2222-2222-2222-222222222221', 1, NULL, 'Cold smoke', 4000, 1, 4000, '');
          SQL

      - name: Run cold compression and verify manifest
        run: |
          docker compose run --rm --no-deps --entrypoint node archive-worker server/compact.mjs
          test "$(docker compose exec -T archive-db psql -At -U store_mgmt -d store_mgmt_archive -c "SELECT count(*) FROM cold_archive_manifests WHERE store_id = '00000000-0000-0000-0000-000000000001' AND order_count > 0 AND compressed_bytes > 0")" -ge "1"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
